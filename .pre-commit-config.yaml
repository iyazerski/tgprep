# Run with `prek run --all-files` (or `prek install` to run on every commit).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: android-lint
        name: android lint
        entry: ./gradlew -q lintRelease
        language: system
        files: ^(app/|gradle/|.*\.gradle\.kts$|gradle\.properties$)
        pass_filenames: false
