name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.TGPREP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TGPREP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint and build
        env:
          TGPREP_KEYSTORE_PASSWORD: ${{ secrets.TGPREP_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon lintRelease assembleRelease
          cp app/build/outputs/apk/release/app-release.apk tgprep.apk

      - uses: actions/upload-artifact@v7
        with:
          name: tgprep-${{ github.run_number }}
          path: tgprep.apk
          if-no-files-found: error

      # A release gives a direct, login-free download link that works from the phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/tgprep.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" tgprep.apk \
            --target "$GITHUB_SHA" \
            --title "TG Prep $tag" \
            --notes "Build from ${GITHUB_SHA::7}. Install: open tgprep.apk on the phone and allow installing from this source." \
            --latest
